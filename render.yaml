# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys the Django backend as a web service with a managed PostgreSQL
# database. Render's Blueprint schema and free-tier plan names can change —
# double check field names and plan availability in Render's dashboard
# before your first deploy.

databases:
  - name: tripsplit-db
    databaseName: tripsplit
    user: tripsplit
    plan: free

services:
  - type: web
    name: tripsplit-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: tripsplit-backend.onrender.com # update if Render assigns a different subdomain
      - key: CORS_ALLOWED_ORIGINS
        value: "" # set to the deployed Vercel URL in Milestone 3.2
      - key: CSRF_TRUSTED_ORIGINS
        value: "" # same as above, with the https:// scheme included
      - key: DATABASE_URL
        fromDatabase:
          name: tripsplit-db
          property: connectionString
